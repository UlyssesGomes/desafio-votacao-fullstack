<app-content-panel title="Criar Pauta" [backButton]="true">
    <form [formGroup]="form" (ngSubmit)="save()" class="flex flex-col gap-3">
        <div class="flex flex-col gap-1">
            <p-floatlabel variant="on">
                <input pInputText id="titulo" formControlName="titulo" autocomplete="off" class="w-full"
                    [invalid]="invalidField('titulo')" />
                <label for="titulo">Título</label>
            </p-floatlabel>

            @if (invalidField('titulo')) {
            <p-message data-cy="titulo-error-message" severity="error" variant="simple" size="small">
                {{ errorMessage('titulo') }}
            </p-message>
            }
        </div>
        <div class="flex flex-col gap-1">
            <p-floatlabel variant="on">
                <textarea pTextarea id="descricao" formControlName="descricao" rows="5" class="w-full"
                    [invalid]="invalidField('descricao')"></textarea>
                <label for="descricao">Descrição</label>
            </p-floatlabel>

            @if (invalidField('descricao')) {
            <p-message data-cy="descricao-error-message" severity="error" variant="simple" size="small">
                {{ errorMessage('descricao') }}
            </p-message>
            }
        </div>

        <p-button type="submit" data-cy="save-button" label="Salvar" [disabled]="form.invalid" />
    </form>
</app-content-panel>
