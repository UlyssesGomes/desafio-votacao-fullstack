<p-dialog [(visible)]="visible" [modal]="true" [style]="{ width: '30rem' }" (onHide)="close()">
    <ng-template #header>
        <h4>Resultado da Votação</h4>
    </ng-template>
    <app-doughnut-chart [data]="chartData"></app-doughnut-chart>
    <ng-template #footer>
        <p-button label="Fechar" severity="secondary" (click)="close()" />
    </ng-template>
</p-dialog>
