<div>
    <app-content-panel title="Pautas">
        <div top-buttons class="mt-1">
            <p-button icon="pi pi-plus" (onClick)="createPauta()"/>
        </div>

        <p-table [value]="pautasList" stripedRows [tableStyle]="{ 'min-width': '50rem', 'table-layout': 'fixed' }" size="large">
            <ng-template #header>
                <tr>
                    <th style="width: 50px;">Id</th>
                    <th style="width: 280px;">Título</th>
                    <th style="width: auto;">Descrição</th>
                    <th class="table-title-cell"></th>
                </tr>
            </ng-template>
            <ng-template #body let-pauta>
                <tr>
                    <td>{{ pauta.id }}</td>
                    <td>{{ pauta.titulo }}</td>
                    <td  class="ellipsis" [title]="pauta.descricao">{{ pauta.descricao }}</td>
                    <td>
                        <p-button data-cy="detail-button" icon="pi pi-search" severity="secondary" rounded (onClick)="showPautaDetails(pauta.id)"/>
                    </td>
                </tr>
            </ng-template>
        </p-table>
        
        <div *ngIf="!pautasList || pautasList.length == 0" class="flex justify-center items-center h-100">
            <p>Nenhuma Pauta cadastrada ainda.</p>
        </div>

        <div class="flex items-center justify-end">
            <span class="mx-1 text-color">Items por página: </span>
            <p-select [options]="options" optionLabel="label" optionValue="value" [(ngModel)]="pageSize"
                (ngModelChange)="changePageSize()" />
            <p-paginator [first]="first" [rows]="pageSize" [totalRecords]="totalRecords" (onPageChange)="onPageChange($event)"
                [showCurrentPageReport]="true" currentPageReportTemplate="{first} - {last} of {totalRecords}"
                [showPageLinks]="false" [showFirstLastIcon]="false"></p-paginator>
        </div>
    </app-content-panel>
</div>
