<div>
    <app-content-panel title="Pautas">

        <p-table [value]="pautasList" stripedRows [tableStyle]="{ 'min-width': '50rem' }" size="large">
            <ng-template #header>
                <tr>
                    <th>Id</th>
                    <th>Título</th>
                    <th>Descrição</th>
                    <th class="table-title-cell"></th>
                </tr>
            </ng-template>
            <ng-template #body let-pauta>
                <tr>
                    <td>{{ pauta.id }}</td>
                    <td>{{ pauta.titulo }}</td>
                    <td class="ellipsis">{{ pauta.descricao }}</td>
                    <td>
                        <p-button icon="pi pi-search" severity="secondary" rounded />
                    </td>
                </tr>
            </ng-template>
        </p-table>

        <div class="flex items-center justify-end">
            <span class="mx-1 text-color">Items por página: </span>
            <p-select [options]="options" optionLabel="label" optionValue="value" [(ngModel)]="pageSize"
                (ngModelChange)="changePageSize()" />
            <p-paginator [first]="first" [rows]="pageSize" [totalRecords]="totalRecords" (onPageChange)="onPageChange($event)"
                [showCurrentPageReport]="true" currentPageReportTemplate="{first} - {last} of {totalRecords}"
                [showPageLinks]="false" [showFirstLastIcon]="false"></p-paginator>
        </div>
    </app-content-panel>
</div>
